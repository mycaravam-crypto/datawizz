# Reference-only nginx template. Replace the hostname and certificate paths.
# DataWizz itself stays bound to 127.0.0.1:3000. Provide external authentication
# and a VPN or administrative IP allowlist before exposing this listener.
map $http_origin $datawizz_origin_allowed {
    default 0;
    "" 1;
    "https://datawizz.example.com" 1;
}

server {
    listen 443 ssl;
    server_name datawizz.example.com;

    ssl_certificate /etc/nginx/certs/datawizz.crt;
    ssl_certificate_key /etc/nginx/certs/datawizz.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    access_log off; # Avoid logging potentially sensitive URL query parameters.
    server_tokens off;
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location / {
        if ($datawizz_origin_allowed = 0) { return 403; }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }
}
