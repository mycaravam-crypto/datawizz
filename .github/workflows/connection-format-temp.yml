name: Temporary Connection Manager rustfmt
on:
  push:
    branches:
      - feat/connection-manager-2-20261103
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt to connection manager
        run: |
          cargo fmt
          if ! git diff --quiet -- src/main.rs src/connection_manager.rs; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/main.rs src/connection_manager.rs
            git commit -m 'style(rust): format connection manager and router'
            git push origin HEAD:feat/connection-manager-2-20261103
          fi
