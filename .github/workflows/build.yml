name: Build
on:
  push:
  pull_request:

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build offline CodeMirror editor
        run: |
          npm install --no-audit --no-fund
          npm run build:editor
      - name: Validate embedded JavaScript and key UI elements
        run: |
          node scripts/check-ui.cjs
          node --check web/vendor/sql-editor.js

  browser-tests:
    # Playwright 1.56 does not support Ubuntu 26.04 (ubuntu-latest on GitHub Actions).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check browser test JavaScript syntax
        run: node --check scripts/browser-smoke.cjs
      - name: Build offline CodeMirror editor
        run: npm run build:editor
      - name: Chromium workbench smoke tests
        run: node scripts/browser-smoke.cjs

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Compose application and verify served UI
        run: bash scripts/refresh-ui.sh
      - name: Verify running Compose UI without rebuilding
        run: bash scripts/refresh-ui.sh --verify-only
      - name: Compose diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=100 app
      - name: Remove Compose containers
        if: always()
        run: docker compose down --remove-orphans

  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: datawizz_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: datawizz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datawizz_test -d datawizz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://datawizz_test:test_only_password@127.0.0.1:5432/datawizz_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build offline editor assets
        run: |
          npm install --no-audit --no-fund
          npm run build:editor
      - name: Rust format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: PostgreSQL integration tests
        run: cargo test -- --test-threads=1

  browser-postgres-e2e:
    # Playwright 1.56 does not support Ubuntu 26.04 (ubuntu-latest on GitHub Actions).
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: datawizz_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: datawizz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datawizz_test -d datawizz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://datawizz_test:test_only_password@127.0.0.1:5432/datawizz_test
      PGPASSWORD: test_only_password
      PORT: '3188'
      DATAWIZZ_ACCESS_TOKEN: 0123456789abcdefghijklmnopqrstuvwxyz
      DATABASE_PROFILES_JSON: '[{"id":"sandbox","label":"Sandbox","url":"postgres://datawizz_test:test_only_password@127.0.0.1:5432/datawizz_profile_test","environment":"test","read_only":true}]'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PostgreSQL client and Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Seed isolated PostgreSQL profiles and FK graph
        run: |
          psql -h 127.0.0.1 -U datawizz_test -d datawizz_test -v ON_ERROR_STOP=1 -c "CREATE DATABASE datawizz_profile_test"
          psql -h 127.0.0.1 -U datawizz_test -d datawizz_profile_test -v ON_ERROR_STOP=1 -c "CREATE TABLE public.profile_only (id integer PRIMARY KEY, label text); INSERT INTO public.profile_only VALUES (1,'sandbox-only');"
          psql -h 127.0.0.1 -U datawizz_test -d datawizz_test -v ON_ERROR_STOP=1 -c "CREATE TABLE public.datawizz_browser_e2e (id integer PRIMARY KEY, label text); INSERT INTO public.datawizz_browser_e2e VALUES (1,'before'); CREATE TABLE public.datawizz_er_child (id integer PRIMARY KEY, parent_id integer REFERENCES public.datawizz_browser_e2e(id));"
      - name: Seed a real restricted PostgreSQL login
        run: |
          psql -h 127.0.0.1 -U datawizz_test -d datawizz_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE datawizz_reader LOGIN PASSWORD 'reader_test_password';
          GRANT CONNECT ON DATABASE datawizz_test TO datawizz_reader;
          GRANT USAGE ON SCHEMA public TO datawizz_reader;
          GRANT SELECT ON public.datawizz_browser_e2e TO datawizz_reader;
          CREATE TABLE public.datawizz_private_e2e (id integer PRIMARY KEY, secret text);
          INSERT INTO public.datawizz_private_e2e VALUES (1, 'not-for-readers');
          REVOKE ALL ON public.datawizz_private_e2e FROM PUBLIC;
          SQL
      - name: Build offline CodeMirror editor
        run: npm run build:editor
      - name: Start Rust application
        run: |
          cargo run > /tmp/datawizz-e2e.log 2>&1 &
          echo $! > /tmp/datawizz-e2e.pid
          for attempt in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:3188/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/datawizz-e2e.log
          exit 1
      - name: Chromium real database editing E2E
        run: node scripts/browser-postgres-e2e.cjs
      - name: Restart application using a restricted database login
        run: |
          kill "$(cat /tmp/datawizz-e2e.pid)"
          for attempt in $(seq 1 30); do
            if ! curl -fsS http://127.0.0.1:3188/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          export DATABASE_PROFILES_JSON='[{"id":"reader","label":"Restricted reader","url":"postgres://datawizz_reader:reader_test_password@127.0.0.1:5432/datawizz_test","environment":"test","read_only":false}]'
          cargo run > /tmp/datawizz-reader-e2e.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3188/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/datawizz-reader-e2e.log
          exit 1
      - name: Restricted HTTP credential E2E
        run: node scripts/restricted-http-e2e.cjs
      - name: Log application diagnostics on failure
        if: failure()
        run: cat /tmp/datawizz-e2e.log || true
