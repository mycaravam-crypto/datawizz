name: Build
on:
  push:
  pull_request:

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate embedded JavaScript and key UI elements
        run: node scripts/check-ui.cjs

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release container
        run: docker build -t datawizz:ci .

  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: datawizz_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: datawizz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datawizz_test -d datawizz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://datawizz_test:test_only_password@127.0.0.1:5432/datawizz_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: PostgreSQL integration tests
        run: cargo test -- --test-threads=1
