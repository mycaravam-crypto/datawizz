name: Temporary branch formatting
on:
  push:
    branches:
      - hardening/ci-permissions-remote-security-20261103

permissions:
  contents: write

jobs:
  format-hardening:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources and commit on this feature branch only
        run: |
          cargo fmt
          if ! git diff --quiet -- src/main.rs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/main.rs
            git commit -m "style(rust): apply rustfmt to existing source"
            git push origin HEAD:hardening/ci-permissions-remote-security-20261103
          fi
