services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: datawizz
      POSTGRES_PASSWORD: datawizz-local-only
      POSTGRES_DB: datawizz
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datawizz -d datawizz"]
      interval: 2s
      timeout: 2s
      retries: 20

  app:
    build:
      context: .
    image: datawizz:local
    develop:
      watch:
        - action: rebuild
          path: ./web
        - action: rebuild
          path: ./src
        - action: rebuild
          path: ./Cargo.toml
        - action: rebuild
          path: ./Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://datawizz:datawizz-local-only@postgres:5432/datawizz
      HOST: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
